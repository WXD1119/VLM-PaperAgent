services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "paper-agent-dev"]
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - redis_data:/data
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: paper_agent
      MYSQL_USER: paper_agent
      MYSQL_PASSWORD: paper-agent-dev
      MYSQL_ROOT_PASSWORD: paper-agent-root-dev
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/paper-agent-dev
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes:
      - neo4j_data:/data

volumes:
  redis_data:
  mysql_data:
  neo4j_data:
